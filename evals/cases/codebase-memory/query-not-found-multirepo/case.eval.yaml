id: cbm-q-not-found-multirepo
suite: codebase-memory-queries-multirepo
description: Multi-repo variant — the queried class exists in neither repository of a parent-of-repos workspace.
image: harness-bench-felan-cbm-runtime:v1
timeoutMs: 600000
workspace:
  containerPath: /home/dev/Projects/FelanAI
  fixture: evals/fixtures/felan-multirepo/v1/source
  setup:
    - command: pnpm
      args: [install, --offline, --frozen-lockfile, --store-dir, /opt/harness-deps/felan-cbm-store]
      cwd: /home/dev/Projects/FelanAI/felan
      timeoutMs: 300000
agents:
  include:
    - felan-cbm-off
    - felan-cbm-on
prompt: |
  This workspace is a parent directory holding several separate repositories as
  sub-directories. Find the class `WorkspaceReconciler` anywhere in the
  workspace. If it exists, answer with the file path where it is defined. If it
  does not exist, answer honestly with `not found` (do not fabricate a plausible
  location).

  Write only that single-line answer — either the file path or `not found` —
  into `/home/dev/Projects/FelanAI/.harness-answer.txt`.
verifier:
  command: node
  args: [/tests/verify.mjs]
  cwd: /home/dev/Projects/FelanAI
  assetsDir: evals/cases/codebase-memory/query-not-found-multirepo/verifier
  assetsTarget: /tests
  rewardFile: .harness-evals-reward.txt
  rewardFormat: text
  timeoutMs: 60000
  network:
    mode: none
