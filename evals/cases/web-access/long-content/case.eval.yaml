id: web-access-cost-long-content
suite: web-access-cost
description: Compare stored-content lookup with shell filtering of a long file.
image: harness-bench-felan-runtime:v1
workspace: { fixture: evals/fixtures/felan-adapter-smoke/v1/source }
agents:
  include: [felan-no-web-access, felan-web-access]
prompt: |
  Could you check this pinned Felan lockfile and tell me which versions of
  `web-streams-polyfill`, `which-typed-array`, and `wsl-utils` it contains?

  https://raw.githubusercontent.com/felan-ai/felan/2c542ffeefd38da0164d997cc580f06eba27c234/pnpm-lock.yaml

  It's a fairly long file and the relevant entries aren't near the beginning,
  so make sure you search the complete content rather than relying on a short
  preview. Please mention the commit and don't modify the workspace.
assert:
  - { type: contains, value: "3.3.3" }
  - { type: contains, value: "1.1.22" }
  - { type: contains, value: "0.3.1" }
  - { type: contains, value: "2c542ffeefd38da0164d997cc580f06eba27c234" }
  - { type: workspaceDiff, changedFiles: [] }
