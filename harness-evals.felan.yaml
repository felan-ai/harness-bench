version: 1

# Standalone first-party Felan adapter smoke case. This intentionally does not
# use the generated DeepSWE cases or DeepSWE images.
tests:
  - felan-smoke/*.yaml

workspace:
  source: felan-smoke/fixture
  mode: copy
  containerPath: /workspace

docker:
  repoPath: /workspace
  home: /tmp/felan-home
  envAllowlist:
    - GEMINI_API_KEY

agents:
  felan-gemini:
    adapter: felan
    provider: google
    model: gemini-2.5-pro
    thinking: low
    timeoutMs: 600000
    useCurrentConfig: false
    config:
      useCurrentConfig: false
      settings:
        builtinExtensions:
          memory: false
          browser: false
          webAccess: false
        felanTui:
          memoryProcessing: false

scoring:
  verifierReward:
    weight: 1
  assertionPassRate:
    weight: 0
  judgeScore:
    weight: 0
