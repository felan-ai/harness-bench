version: 1

tests:
  - evals/cases/**/*.eval.yaml

workspace:
  mode: copy
  containerPath: /workspace

docker:
  repoPath: /workspace
  home: /tmp/felan-home
  envAllowlist: []

agents:
  felan-no-prewalk:
    adapter: felan
    provider: openai-codex
    model: gpt-5.6-sol
    thinking: max
    timeoutMs: 900000
    auth:
      type: oauth
    useCurrentConfig: false
    config:
      useCurrentConfig: false
      settings:
        builtinExtensions:
          prewalk: false
        extensionConfig:
          codex:
            fast: true
        felanTui:
          memoryProcessing: false

  felan-all:
    extends: felan-no-prewalk
    config:
      settings:
        builtinExtensions:
          prewalk: true
        extensionConfig:
          codex:
            fast: true
          prewalk:
            targetModel: openai-codex/gpt-5.6-luna
            targetThinking: medium
            restorePlanner: true
            entryApproval: always
        felanTui:
          memoryProcessing: false

  felan-smoke:
    extends: felan-no-prewalk
    model: gpt-5.6-terra
    thinking: low
    timeoutMs: 600000

  felan-output-style-disabled:
    extends: felan-smoke
    label: Output style disabled
    config:
      settings:
        builtinExtensions:
          prewalk: false
          outputStyle: false
        felanTui:
          memoryProcessing: false

  felan-output-style-concise:
    extends: felan-output-style-disabled
    label: Concise output style
    config:
      settings:
        builtinExtensions:
          prewalk: false
          outputStyle: true
        extensionConfig:
          outputStyle:
            style: concise
        felanTui:
          memoryProcessing: false

  felan-output-style-explanatory:
    extends: felan-output-style-disabled
    label: Explanatory output style
    config:
      settings:
        builtinExtensions:
          prewalk: false
          outputStyle: true
        extensionConfig:
          outputStyle:
            style: explanatory
        felanTui:
          memoryProcessing: false

scoring:
  verifierReward:
    weight: 1
  assertionPassRate:
    weight: 0
  judgeScore:
    weight: 0

visualization:
  enabled: true
  formats: [html, json, csv]
  latest: true
