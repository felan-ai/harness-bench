version: 1

tests:
  - evals/cases/**/*.eval.yaml

workspace:
  mode: copy
  containerPath: /workspace

docker:
  repoPath: /workspace
  home: /tmp/felan-home
  envAllowlist:
    - AI_GATEWAY_API_KEY

agents:
  felan-vercel-gpt56-terra-low:
    adapter: felan
    provider: vercel-ai-gateway
    model: openai/gpt-5.6-terra
    thinking: low
    timeoutMs: 600000
    apiKeyEnv: AI_GATEWAY_API_KEY
    useCurrentConfig: false
    config:
      packageVersion: 0.14.2
      useCurrentConfig: false

  felan-vercel-gpt56-sol-high-no-prewalk:
    extends: felan-vercel-gpt56-terra-low
    model: openai/gpt-5.6-sol
    thinking: high
    timeoutMs: 900000
    config:
      settings:
        builtinExtensions:
          prewalk: false
        felanTui:
          memoryProcessing: false

  felan-vercel-gpt56-luna-medium-no-prewalk:
    extends: felan-vercel-gpt56-sol-high-no-prewalk
    model: openai/gpt-5.6-luna
    thinking: medium

  felan-vercel-gpt56-sol-high-prewalk-luna-medium:
    extends: felan-vercel-gpt56-sol-high-no-prewalk
    config:
      settings:
        builtinExtensions:
          prewalk: true
        extensionConfig:
          prewalk:
            targetModel: vercel-ai-gateway/openai/gpt-5.6-luna
            targetThinking: medium
            restorePlanner: true
            entryApproval: always
        felanTui:
          memoryProcessing: false

scoring:
  verifierReward:
    weight: 1
  assertionPassRate:
    weight: 0
  judgeScore:
    weight: 0

visualization:
  enabled: true
  formats: [html, json, csv]
  latest: true
