id: output-style-coding-summary
suite: output-style
description: Compare final summaries after the same small coding task.
workspace:
  fixture: evals/fixtures/output-style/v1/source
agents:
  include:
    - felan-output-style-disabled
    - felan-output-style-concise
    - felan-output-style-explanatory
prompt: |
  Please finish the small calculator fix: implement `add(left, right)` in
  `src/calculator.js` so it returns the numeric sum of its arguments. Keep the
  change limited to that file and inspect the result before you wrap up.

  In your handoff, tell me what changed and how you checked it. No automated
  tests or build are available for this fixture, so don't imply that either
  ran. If nothing got in the way, just say "No blockers."
assert:
  - id: outcome-retained
    type: contains
    value: "add"
  - id: verification-retained
    type: contains
    value: "Checked"
  - id: caveat-retained
    type: contains
    value: "automated test"
  - id: blocker-retained
    type: contains
    value: "No blockers"
  - id: files-retained
    type: contains
    value: "src/calculator.js"
  - id: no-unsupported-test-claim
    type: notContains
    value: "tests passed"
  - id: focused-edit
    type: workspaceDiff
    changedFiles: [src/calculator.js]
verifier:
  command: node
  args: [/tests/verify.mjs]
  cwd: /workspace
  assetsDir: evals/cases/output-style/coding-summary/verifier
  assetsTarget: /tests
  rewardFile: .harness-evals-reward.txt
  rewardFormat: text
  timeoutMs: 30000
  network:
    mode: none
