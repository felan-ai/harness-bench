id: web-access-cost-repository
suite: web-access-cost
description: Compare repository extraction with git clone and shell search.
image: harness-bench-felan-runtime:v1
workspace: { fixture: evals/fixtures/felan-adapter-smoke/v1/source }
agents:
  include: [felan-web-access-off, felan-web-access-on]
prompt: |
  I'm trying to understand a few limits in Felan's web-access package. Could
  you inspect this exact repository revision and find the package version, the
  maximum number of files included in a repository structure, and the maximum
  number of cached result entries?

  https://github.com/felan-ai/felan/tree/2c542ffeefd38da0164d997cc580f06eba27c234

  Please include the source commit in your answer. If you need temporary files
  or a clone, keep them outside the workspace and clean them up when you're
  finished.
assert:
  - { type: contains, value: "0.4.2" }
  - { type: contains, value: "200" }
  - { type: contains, value: "128" }
  - { type: contains, value: "2c542ffeefd38da0164d997cc580f06eba27c234" }
  - { type: workspaceDiff, changedFiles: [] }
