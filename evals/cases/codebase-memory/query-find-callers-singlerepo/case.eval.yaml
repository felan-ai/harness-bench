id: cbm-q-find-callers-singlerepo
suite: codebase-memory-queries-singlerepo
description: Compare Codebase Memory off vs on when listing callers of ProjectService.gitRoot.
image: harness-bench-felan-cbm-runtime:v1
timeoutMs: 600000
workspace:
  containerPath: /home/dev/Projects/felan
  git:
    repository: https://github.com/felan-ai/felan.git
    commit: 7ae8f94e72095a8bc38bf62b902164d2717f3294
  setup:
    - command: pnpm
      args: [install, --offline, --frozen-lockfile, --store-dir, /opt/harness-deps/felan-cbm-store]
      timeoutMs: 300000
agents:
  include:
    - felan-cbm-off
    - felan-cbm-on
prompt: |
  Find every caller of `ProjectService.gitRoot` in this repository. A caller is
  a location where the method is actually invoked on a `ProjectService`
  instance, not any use of the string `gitRoot` or an unrelated local variable
  with the same name.

  List each caller as one line in the format `path/to/file.ts:LINE`, one per
  line, sorted alphabetically. Do not include any commentary.

  Write only that file-path-and-line-number list into
  `/home/dev/Projects/felan/.harness-answer.txt`.
verifier:
  command: node
  args: [/tests/verify.mjs]
  cwd: /home/dev/Projects/felan
  assetsDir: evals/cases/codebase-memory/query-find-callers-singlerepo/verifier
  assetsTarget: /tests
  rewardFile: .harness-evals-reward.txt
  rewardFormat: text
  timeoutMs: 60000
  network:
    mode: none
