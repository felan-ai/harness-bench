id: markitdown-unused-overhead
suite: markitdown-cost
description: Measure fixed MarkItDown capability overhead when no document conversion is used.
image: harness-bench-felan-runtime:v1
workspace:
  fixture: evals/fixtures/markitdown/v1/source
agents:
  include: [felan-no-markitdown, felan-markitdown]
prompt: |
  Read only `README.md`. Report the plain-text control codename and status.
  Do not inspect the `docs` directory and do not change any files.
assert:
  - { type: contains, value: "Harbor Finch" }
  - { type: contains, value: "READY" }
  - type: toolCalled
    name: read
    min: 1
    argsContain: [README.md]
  - { type: workspaceDiff, changedFiles: [] }
