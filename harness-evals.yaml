version: 1

tests:
  - evals/cases/**/*.eval.yaml

workspace:
  mode: copy
  containerPath: /workspace

docker:
  repoPath: /workspace
  home: /tmp/felan-home
  envAllowlist: []

agents:
  felan-no-prewalk:
    adapter: felan
    provider: openai-codex
    model: gpt-5.6-sol
    thinking: high
    timeoutMs: 900000
    auth:
      type: oauth
    useCurrentConfig: false
    config:
      packageVersion: 0.14.2
      useCurrentConfig: false
      settings:
        builtinExtensions:
          prewalk: false
        felanTui:
          memoryProcessing: false

  felan-all:
    extends: felan-no-prewalk
    config:
      settings:
        builtinExtensions:
          prewalk: true
        extensionConfig:
          prewalk:
            targetModel: openai-codex/gpt-5.6-luna
            targetThinking: medium
            restorePlanner: true
            entryApproval: always
        felanTui:
          memoryProcessing: false

  felan-smoke:
    extends: felan-no-prewalk
    model: gpt-5.6-terra
    thinking: low
    timeoutMs: 600000

scoring:
  verifierReward:
    weight: 1
  assertionPassRate:
    weight: 0
  judgeScore:
    weight: 0

visualization:
  enabled: true
  formats: [html, json, csv]
  latest: true
