id: cbm-q-find-callers-multirepo
suite: codebase-memory-queries-multirepo
description: Multi-repo variant — list callers of ProjectService.gitRoot in a parent-of-repos workspace.
image: harness-bench-felan-cbm-runtime:v1
timeoutMs: 600000
workspace:
  containerPath: /home/dev/Projects/FelanAI
  fixture: evals/fixtures/felan-multirepo/v1/source
  setup:
    - command: pnpm
      args: [install, --offline, --frozen-lockfile, --store-dir, /opt/harness-deps/felan-cbm-store]
      cwd: /home/dev/Projects/FelanAI/felan
      timeoutMs: 300000
agents:
  include:
    - felan-cbm-off
    - felan-cbm-on
prompt: |
  This workspace is a parent directory holding several separate repositories as
  sub-directories. Find every caller of `ProjectService.gitRoot` across the
  whole workspace. A caller is a location where the method is actually invoked
  on a `ProjectService` instance, not any use of the string `gitRoot` or an
  unrelated local variable with the same name.

  List each caller as one line in the format `some-repo/path/to/file.ts:LINE`
  — paths relative to the workspace root, so each one starts with the
  sub-directory name — one per line, sorted alphabetically. Do not include any
  commentary.

  Write only that file-path-and-line-number list into
  `/home/dev/Projects/FelanAI/.harness-answer.txt`.
verifier:
  command: node
  args: [/tests/verify.mjs]
  cwd: /home/dev/Projects/FelanAI
  assetsDir: evals/cases/codebase-memory/query-find-callers-multirepo/verifier
  assetsTarget: /tests
  rewardFile: .harness-evals-reward.txt
  rewardFormat: text
  timeoutMs: 60000
  network:
    mode: none
