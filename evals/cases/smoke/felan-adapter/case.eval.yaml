id: felan-adapter-smoke
suite: smoke
description: Verify the built-in Felan adapter can edit a tiny workspace and pass a deterministic verifier.
workspace:
  fixture: evals/fixtures/felan-adapter-smoke/v1/source
agents:
  include:
    - felan-vercel-gpt56-terra-low
  overrides:
    felan-vercel-gpt56-terra-low:
      config:
        settings:
          builtinExtensions:
            memory: false
            browser: false
            webAccess: false
            prewalk: false
          felanTui:
            memoryProcessing: false
prompt: |
  Open /workspace/target.txt and replace its contents with exactly:
  FELAN_SMOKE_PASS

  Do not change any other file. Verify the file contents before finishing.
assert: []
verifier:
  command: node
  args:
    - /tests/verify.mjs
  cwd: /workspace
  assetsDir: evals/cases/smoke/felan-adapter/verifier
  assetsTarget: /tests
  rewardFile: .harness-evals-reward.txt
  rewardFormat: text
  timeoutMs: 60000
  network:
    mode: none
