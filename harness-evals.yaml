version: 1

tests:
  - evals/tests/**/*.yaml

workspace:
  mode: copy
  containerPath: /workspace

docker:
  repoPath: /workspace
  home: /tmp/felan-home
  envAllowlist:
    - GEMINI_API_KEY

agents:
  felan-gemini:
    adapter: felan
    provider: google
    model: gemini-2.5-pro
    thinking: low
    timeoutMs: 600000
    useCurrentConfig: false
    config:
      useCurrentConfig: false

scoring:
  verifierReward:
    weight: 1
  assertionPassRate:
    weight: 0
  judgeScore:
    weight: 0

visualization:
  enabled: true
  formats: [html, json, csv]
  latest: true
