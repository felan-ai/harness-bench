id: rtk-felan-project-instructions
suite: rtk
description: Compare RTK disabled versus enabled while fixing a real historical Felan project-instructions regression.
image: harness-bench-felan-runtime:v1
timeoutMs: 1800000
workspace:
  git:
    repository: https://github.com/felan-ai/felan.git
    commit: 104faa5559029c8be9e8a1eb504d87974a5864e9
  setup:
    - command: pnpm
      args: [install, --frozen-lockfile, --store-dir, /tmp/pnpm-store]
      timeoutMs: 300000
      network:
        mode: default
agents:
  include:
    - felan-no-rtk-optimizer
    - felan-rtk-optimizer
prompt: |
  Fix Felan's root project-instructions regression.

  A session created for a project currently starts without that project's root
  instructions. At session creation time, Felan must load at most one
  instruction file from the session working directory through `AgentRuntime`:

  - prefer `AGENTS.md` when it is readable and non-empty;
  - use `CLAUDE.md` only when `AGENTS.md` is absent or unreadable;
  - if the selected file is empty, add no project instructions;
  - missing, unreadable, and empty instruction files must remain nonfatal; and
  - do not enable ambient or nested context-file discovery.

  The selected file must appear in the composed system prompt as project
  instructions before the current-working-directory section. Preserve existing
  extension, capability, skill, and runtime-tool composition behavior.

  Keep changes inside `packages/agent-core/src`. Do not change tests, package
  versions, dependencies, lockfiles, or repository history, and do not create a
  Git commit. Run the Agent Core build and type-check plus the focused session
  and resource-loader tests before finishing; unrelated host-process integration
  tests are outside this task. Summarize the implementation and verification.
assert:
  - id: prewalk-entered
    type: toolCalled
    name: enter_prewalk
    isError: false
    when:
      agent: felan-all
  - id: prewalk-disabled
    type: toolCalled
    name: enter_prewalk
    min: 0
    max: 0
    when:
      agent: felan-no-prewalk
  - id: source-changed
    type: workspaceDiff
    minChanged: 1
verifier:
  command: node
  args: [/tests/verify.mjs]
  cwd: /workspace
  assetsDir: evals/cases/rtk/project-instructions/verifier
  assetsTarget: /tests
  rewardFile: .harness-evals-reward.txt
  rewardFormat: text
  timeoutMs: 300000
  network:
    mode: none
