id: web-access-cost-claim
suite: web-access-cost
description: Compare evidence verification with and without source_check.
image: harness-bench-felan-runtime:v1
workspace: { fixture: evals/fixtures/felan-adapter-smoke/v1/source }
agents:
  include: [felan-no-web-access, felan-web-access]
prompt: |
  Someone told me that Felan's web-access extension keeps fetched results for
  exactly two hours. Can you check that against the official Felan source at
  commit `2c542ffeefd38da0164d997cc580f06eba27c234` and tell me whether it's
  correct? Please include the actual retention period and the source file path.
  This should only need a documentation lookup, so don't clone the whole
  repository or change anything in the workspace.
assert:
  - { type: contains, value: "one hour" }
  - { type: contains, value: "2c542ffeefd38da0164d997cc580f06eba27c234" }
  - { type: contains, value: "packages/ext-web-access/" }
  - { type: workspaceDiff, changedFiles: [] }
